[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "mustmatch"
version = "0.0.4"
description = "CLI output assertion tool for documentation testing"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Ian Maurer", email = "ian@genomoncology.com" },
]
keywords = ["testing", "documentation", "cli", "assertions"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Testing",
  "Topic :: Documentation",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/genomoncology/mustmatch"
Repository = "https://github.com/genomoncology/mustmatch"

[tool.maturin]
manifest-path = "crates/mustmatch-cli/Cargo.toml"
bindings = "bin"

[tool.mustmatch]
auto_imports = []
